services:
  db:
    image: postgres:15
    container_name: user-management-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: UserDetails
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d UserDetails"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: user-management-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data: